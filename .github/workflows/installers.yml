name: Installers

# Builds the PolyPal installers for Windows, macOS and Linux and attaches them
# to the workflow run (Actions → Installers → a run → Artifacts). Tagged
# releases are published by release.yml instead.
on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            builder: --win
            files: |
              dist/*.exe
          - os: macos-latest
            name: macos-arm64
            builder: --mac --arm64
            files: |
              dist/*.dmg
          - os: ubuntu-latest
            name: linux
            builder: --linux
            files: |
              dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download bundled Python
        run: node scripts/download-python-embed.js

      - name: Build and package
        shell: bash
        run: npm run build && npx electron-builder ${{ matrix.builder }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PolyPal-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
